<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}物种分类整理{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <span class="brand">生物多样性观测 · 分类沿革整理</span>
  <a href="{{ url_for('main.index') }}">首页</a>
  <a href="{{ url_for('main.upload_obs') }}">上传观测 CSV</a>
  <a href="{{ url_for('main.upload_tax') }}">上传沿革 CSV</a>
  <a href="{{ url_for('main.runs') }}">计算记录</a>
  <a href="{{ url_for('main.revisions') }}">输入修订</a>
</nav>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>观测记录按现行物种分类整理 · 结果固定输入修订 · 失败不开放半份结果</footer>
</body>
</html>
